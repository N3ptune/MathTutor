name: Terraform Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infrastructure/terraform
  ENVIRONMENT: ${{ github.ref_name == 'staging' && 'staging' || 'prod' }}

# Shared with the backend workflow so they never update App Runner at the same time
concurrency:
  group: apprunner-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'staging' && secrets.STAGING_AWS_ROLE_ARN || github.ref_name != 'staging' && secrets.AWS_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate"

      - name: Terraform Plan
        env:
          # Optional custom domain: a JSON list like ["mathtutor.com","www.mathtutor.com"] and its ACM cert
          TF_VAR_frontend_domain_names: ${{ github.ref_name == 'staging' && vars.STAGING_TF_FRONTEND_DOMAIN_NAMES || github.ref_name != 'staging' && vars.TF_FRONTEND_DOMAIN_NAMES || '[]' }}
          TF_VAR_frontend_certificate_arn: ${{ github.ref_name == 'staging' && vars.STAGING_TF_FRONTEND_CERTIFICATE_ARN || github.ref_name != 'staging' && vars.TF_FRONTEND_CERTIFICATE_ARN || '' }}
        run: >-
          terraform plan -input=false -out=tfplan
          -var="github_repo=${{ github.repository }}"
          -var="environment=${{ env.ENVIRONMENT }}"
          -var="deploy_branch=${{ env.ENVIRONMENT == 'prod' && 'main' || 'staging' }}"
          -var="create_github_oidc_provider=${{ env.ENVIRONMENT == 'prod' }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
