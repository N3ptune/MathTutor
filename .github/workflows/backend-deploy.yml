name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug trigger context
        run: |
          #region agent log
          python3 - <<'PY'
          import json
          import time
          import os

          log_path = "/Users/lmcnatt/Projects/MathTutor/.cursor/debug-511fd2.log"
          payloads = [
              {
                  "sessionId": "511fd2",
                  "runId": "pre-fix",
                  "hypothesisId": "H4",
                  "location": ".github/workflows/backend-deploy.yml",
                  "message": "Captured workflow trigger event context",
                  "data": {
                      "eventName": os.environ.get("GITHUB_EVENT_NAME", ""),
                      "ref": os.environ.get("GITHUB_REF", ""),
                      "sha": os.environ.get("GITHUB_SHA", ""),
                  },
                  "timestamp": int(time.time() * 1000),
              },
              {
                  "sessionId": "511fd2",
                  "runId": "pre-fix",
                  "hypothesisId": "H5",
                  "location": ".github/workflows/backend-deploy.yml",
                  "message": "Captured repository/workflow context",
                  "data": {
                      "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                      "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                      "actor": os.environ.get("GITHUB_ACTOR", ""),
                  },
                  "timestamp": int(time.time() * 1000),
              },
          ]

          for payload in payloads:
              print(json.dumps(payload, ensure_ascii=True))
              try:
                  with open(log_path, "a", encoding="utf-8") as f:
                      f.write(json.dumps(payload, ensure_ascii=True) + "\n")
              except Exception:
                  pass
          PY
          #endregion

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to App Runner
        run: |
          SERVICE_ARN='${{ vars.APPRUNNER_SERVICE_ARN }}'
          IMAGE_IDENTIFIER='${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest'
          SOURCE_CONFIGURATION='{
            "ImageRepository": {
              "ImageIdentifier": "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000"
              }
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ vars.APPRUNNER_ECR_ROLE_ARN }}"
            },
            "AutoDeploymentsEnabled": false
          }'

          export SERVICE_ARN IMAGE_IDENTIFIER SOURCE_CONFIGURATION

          #region agent log
          python3 - <<'PY'
          import json
          import time
          import re
          import os

          log_path = "/Users/lmcnatt/Projects/MathTutor/.cursor/debug-511fd2.log"
          service_arn = os.environ.get("SERVICE_ARN", "")
          image_identifier = os.environ.get("IMAGE_IDENTIFIER", "")
          source_configuration = os.environ.get("SOURCE_CONFIGURATION", "")

          payloads = [
              {
                  "sessionId": "511fd2",
                  "runId": "pre-fix",
                  "hypothesisId": "H1",
                  "location": ".github/workflows/backend-deploy.yml",
                  "message": "Captured APPRUNNER_SERVICE_ARN tokenization",
                  "data": {
                      "serviceArn": service_arn,
                      "serviceArnHasWhitespace": bool(re.search(r"\s", service_arn)),
                      "serviceArnTokenCount": len(service_arn.split()),
                      "serviceArnLooksLikeArn": service_arn.startswith("arn:aws:apprunner:"),
                  },
                  "timestamp": int(time.time() * 1000),
              },
              {
                  "sessionId": "511fd2",
                  "runId": "pre-fix",
                  "hypothesisId": "H2",
                  "location": ".github/workflows/backend-deploy.yml",
                  "message": "Captured image identifier used for update-service",
                  "data": {
                      "imageIdentifier": image_identifier,
                      "imageIdentifierHasWhitespace": bool(re.search(r"\s", image_identifier)),
                  },
                  "timestamp": int(time.time() * 1000),
              },
              {
                  "sessionId": "511fd2",
                  "runId": "pre-fix",
                  "hypothesisId": "H3",
                  "location": ".github/workflows/backend-deploy.yml",
                  "message": "Validated source configuration JSON before aws call",
                  "data": {
                      "sourceConfigurationJsonValid": True,
                  },
                  "timestamp": int(time.time() * 1000),
              },
          ]

          try:
              json.loads(source_configuration)
          except Exception:
              payloads[2]["data"]["sourceConfigurationJsonValid"] = False

          for payload in payloads:
              print(json.dumps(payload, ensure_ascii=True))
              try:
                  with open(log_path, "a", encoding="utf-8") as f:
                      f.write(json.dumps(payload, ensure_ascii=True) + "\n")
              except Exception:
                  pass
          PY
          #endregion

          aws apprunner update-service \
            --service-arn $SERVICE_ARN \
            --source-configuration "$SOURCE_CONFIGURATION"
