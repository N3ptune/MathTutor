name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # start-deployment pulls the new :latest image and keeps the service's
      # existing config. update-service with the same image tag can be a no-op,
      # and passing --source-configuration replaces the whole block, which drops
      # the runtime env vars and SSM secrets Terraform set (ALLOWED_ORIGINS, keys).
      #
      # App Runner rejects a deployment while another operation is in progress,
      # e.g. when the Terraform workflow is updating the service from the same push,
      # so wait (up to 20 minutes) for the service to be RUNNING first.
      - name: Deploy to App Runner
        env:
          SERVICE_ARN: ${{ vars.APPRUNNER_SERVICE_ARN }}
        run: |
          for i in $(seq 1 80); do
            status=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query Service.Status --output text)
            case "$status" in
              RUNNING)
                aws apprunner start-deployment --service-arn "$SERVICE_ARN"
                exit 0
                ;;
              OPERATION_IN_PROGRESS)
                echo "Service is busy with another operation; waiting... ($i/80)"
                sleep 15
                ;;
              *)
                echo "::error::App Runner service is $status, not RUNNING. Check the service in the AWS console."
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for the App Runner service to become RUNNING."
          exit 1
