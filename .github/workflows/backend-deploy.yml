name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to App Runner
        run: |
          SERVICE_ARN_RAW='${{ vars.APPRUNNER_SERVICE_ARN }}'
          SERVICE_ARN="$(printf '%s' "$SERVICE_ARN_RAW" | sed -E 's#(service/[^[:space:]]+)[[:space:]]+(backend/[[:alnum:]]+)#\1/\2#g')"
          IMAGE_IDENTIFIER='${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest'
          SOURCE_CONFIGURATION='{
            "ImageRepository": {
              "ImageIdentifier": "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000"
              }
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ vars.APPRUNNER_ECR_ROLE_ARN }}"
            },
            "AutoDeploymentsEnabled": false
          }'

          export SERVICE_ARN IMAGE_IDENTIFIER SOURCE_CONFIGURATION

          if [[ "$SERVICE_ARN" =~ [[:space:]] ]]; then
            echo "SERVICE_ARN still contains whitespace after sanitization: '$SERVICE_ARN'"
            exit 1
          fi

          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "$SOURCE_CONFIGURATION"
