name: Frontend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and Deploy Frontend
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'staging' && secrets.STAGING_AWS_ROLE_ARN || github.ref_name != 'staging' && secrets.AWS_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ github.ref_name == 'staging' && vars.STAGING_VITE_API_URL || github.ref_name != 'staging' && vars.VITE_API_URL || '' }}
          VITE_SUPABASE_URL: ${{ github.ref_name == 'staging' && vars.STAGING_VITE_SUPABASE_URL || github.ref_name != 'staging' && vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_VITE_SUPABASE_ANON_KEY || github.ref_name != 'staging' && secrets.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_SENTRY_DSN: ${{ github.ref_name == 'staging' && vars.STAGING_VITE_SENTRY_DSN || github.ref_name != 'staging' && vars.VITE_SENTRY_DSN || '' }}
          VITE_ENVIRONMENT: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
          # Same for every environment
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_LEGAL_ENTITY: ${{ vars.VITE_LEGAL_ENTITY }}
          VITE_GOVERNING_LAW: ${{ vars.VITE_GOVERNING_LAW }}
        run: npm run build

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ github.ref_name == 'staging' && vars.STAGING_S3_BUCKET_NAME || github.ref_name != 'staging' && vars.S3_BUCKET_NAME || '' }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ github.ref_name == 'staging' && vars.STAGING_CLOUDFRONT_DISTRIBUTION_ID || github.ref_name != 'staging' && vars.CLOUDFRONT_DISTRIBUTION_ID || '' }} \
            --paths "/*"
