name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          #region agent log 66f9c4
          echo "DEBUG 66f9c4 H1/H3: env var presence + value check"
          echo "VITE_SUPABASE_URL set: $([[ -n \"$VITE_SUPABASE_URL\" ]] && echo YES || echo NO)"
          echo "VITE_SUPABASE_URL first 20 chars: ${VITE_SUPABASE_URL:0:20}"
          echo "VITE_SUPABASE_ANON_KEY set: $([[ -n \"$VITE_SUPABASE_ANON_KEY\" ]] && echo YES || echo NO)"
          echo "VITE_SUPABASE_ANON_KEY length: ${#VITE_SUPABASE_ANON_KEY}"
          echo "VITE_FIREBASE_API_KEY set: $([[ -n \"$VITE_FIREBASE_API_KEY\" ]] && echo YES || echo NO)"
          #endregion
          npm run build
          #region agent log 66f9c4 post-build bundle verification
          echo "DEBUG 66f9c4 H1/H2: verifying Supabase URL embedded in bundle..."
          BUNDLE=$(ls dist/assets/index-*.js | head -n 1)
          echo "Bundle file: $BUNDLE"
          if grep -q "supabase" "$BUNDLE"; then
            echo "RESULT: 'supabase' string FOUND in bundle (H2 rejected)"
          else
            echo "RESULT: WARNING - 'supabase' string NOT found in bundle (H1/H4 confirmed)"
          fi
          if grep -q "${VITE_SUPABASE_URL:0:10}" "$BUNDLE" 2>/dev/null && [[ -n "${VITE_SUPABASE_URL:0:10}" ]]; then
            echo "RESULT: Supabase URL prefix IS embedded in bundle"
          else
            echo "RESULT: WARNING - Supabase URL prefix NOT embedded in bundle"
          fi
          #endregion

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
